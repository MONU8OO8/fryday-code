# The free public demo on GitHub Pages: the landing page at /, the replay app at /app/.
# It is the real UI with core swapped for an in-browser replay of a recorded task
# (ui/src/demo/), so it needs no server and makes no AI calls.
#
# One-time setup: Settings → Pages → Source: "GitHub Actions".

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the UI's dependencies
        run: npm --prefix ui ci

      - name: Build the demo site
        run: npm run build:demo
        env:
          # The site is served from https://<owner>.github.io/<repository>/ (read by ui/vite.config.ts).
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: No Jekyll processing
        run: touch ui/dist-demo/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
